aid: laka
name: Laka
description: 'Laka is a European InsurTech with deep micro-mobility expertise, insuring
  bikes, e-bikes, e-scooters and cycling gear against theft, accidental damage and
  loss, and providing riders and businesses with liability and personal accident cover.
  Laka exposes two partner-facing APIs. The Quote API is a lightweight integration
  for Introducer partners — retailers, e-commerce stores, bike brands and online communities
  — that returns pricing to riders, shares rider information to pre-fill onboarding,
  hands customers directly into Laka onboarding, and checks whether a rider has taken
  out cover. The Platform API supports Group partnerships where Laka issues the partner
  a Group policy whose benefits are extended to the partner''s members: partners can
  list policies, add and remove beneficiaries, manage products and documents, and
  create, submit and track claims. Both APIs run as regional instances across the
  UK (gb) and EU (nl), are secured with API keys, and require x-api-region and x-api-language
  headers so the insured party is attributed to the correct regulatory region.'
