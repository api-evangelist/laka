quoted_guidance: 'Please use **Staging** for testing purposes.'

key_prefixes:
  published: false
  note: 'Laka does not document test-vs-live key prefixes. The same header names (x-api-key for the
    Platform API, Authorization for the Quote API) are used in every environment; the environment is
    selected by host.'

test_data:
  published: false
  note: 'Laka publishes no test fixtures — no magic identifiers, no seeded policies or persons, and no
    documented trigger values for forcing claim states. Nothing is asserted here; test data is
    provisioned per partner during onboarding.'

time_simulation:
  published: false
  note: 'No test clock or time-travel tooling is documented for simulating policy renewal, lapse or
    claim ageing.'

console:
  published: false
  note: 'The Laka documentation is hosted on ReadMe, which renders an interactive Try It console on
    each API reference page, but it requires a partner-issued key and Laka publishes no standalone
    developer console or playground.'

access:
  self_service: false
  url: https://docs.laka.co/docs/request-access
  note: Access to any environment, staging included, is requested by email from Laka.
