versioning:
  scheme: date-based documentation versions plus a path version segment
  documentation_versions:
  - version: '2024-09-01'
    status: current
    note: The version the Laka documentation serves by default.
  - version: '2023-03-01'
    status: available
    note: An earlier documentation version still selectable in the Laka docs version picker.
  path_versions:
  - api: Laka Platform API
    prefix: /v3
    note: Platform operations are served under a /v3 path prefix.
  - api: Laka Quote API
    prefix: /v2/quotes
    note: The Quote service is mounted at /v2/quotes on the regional host.
  spec_versions:
  - api: Laka Platform API
    info_version: '2024-09-01'
  - api: Laka Quote API
    info_version: '1.0'
  note: 'Laka versions its documentation by date (2023-03-01, 2024-09-01) while the HTTP surface
    carries its own path version. The Platform OpenAPI info.version tracks the date-based
    documentation version.'

