deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: 'Laka publishes no deprecation or sunset policy, and no RFC 8594 Sunset/Deprecation headers
    are documented. No operation in the published OpenAPI carries deprecated: true. Older
    documentation versions remain selectable in the docs version picker, which is the only
    version-retirement signal Laka gives. No Deprecation pointer is emitted for this provider.'

sla:
  published: false
  note: 'No public SLA or uptime commitment is published on the Laka developer surface; the status
    page reports historical uptime but states no contractual target.'

changelog:
  published: false
  note: 'Laka publishes no dated developer changelog or release-notes page. Change is communicated
    through the date-versioned documentation (2023-03-01 to 2024-09-01) rather than a per-release
    log, so no changelog/ artifact is emitted.'

access:
  model: request-based
  note: 'API access is granted per partner. Laka asks prospective partners to request access by email
    rather than offering self-service key issuance.'
  url: https://docs.laka.co/docs/request-access
